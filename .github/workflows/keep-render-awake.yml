name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            https://portafolio-jr-backend.onrender.com/api/health

      - name: Warm up Groq chat endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 20 \
            https://portafolio-jr-backend.onrender.com/api/chat/warmup \
          || curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 25 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"message":"Responde solo: ok","language":"es"}' \
            https://portafolio-jr-backend.onrender.com/api/chat
